name: Feature request
description: Suggest a new feature or improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Please open an issue before sending a PR for anything bigger than a typo. Saves you the effort of building something we end up not landing.
  - type: textarea
    id: problem
    attributes:
      label: What's the problem?
      description: What are you trying to do that the app doesn't support today?
      placeholder: I'm rehearsing for X and I need to be able to ...
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What would the feature look like? Sketches, mocks, or pseudocode welcome.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: What else did you think about, and why isn't it the right fit?
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Links, prior art, related issues.
