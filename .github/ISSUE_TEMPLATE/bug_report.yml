name: Bug report
description: Report something that's broken or misbehaving.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug. Please fill out as much as you can.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: When I click X, Y happens instead of Z.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: How can someone else hit the same bug?
      placeholder: |
        1. Go to ...
        2. Click ...
        3. See error
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behaviour
      description: What did you think would happen?
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: Browser + version
      placeholder: "Chrome 131 on macOS 15.1"
    validations:
      required: true
  - type: dropdown
    id: webgpu
    attributes:
      label: Was WebGPU available?
      description: Check the model status bar at the top of the page. If it says "wasm", WebGPU is not available.
      options:
        - "Yes (WebGPU)"
        - "No (WASM fallback)"
        - "Not sure"
    validations:
      required: true
  - type: textarea
    id: console
    attributes:
      label: Console errors
      description: Any errors in the browser DevTools console? Paste them here.
      render: shell
  - type: textarea
    id: extra
    attributes:
      label: Anything else?
      description: Screenshots, screen recordings, related links — drop them here.
